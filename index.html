<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truth Chat Bottle Game</title>
 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9641972902370359"
     crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    color: white;
    min-height: 100vh;
  }
  .screen { padding: 16px; max-width: 480px; margin: 0 auto; text-align: center; }
  h1 { font-size: 20px; margin: 10px 0; }
  input {
    width: 100%; padding: 12px; margin: 6px 0; font-size: 16px;
    border: none; border-radius: 10px;
  }
  button {
    padding: 12px 24px; font-size: 18px; border: none; border-radius: 30px;
    background: #ff4081; color: white; cursor: pointer; margin: 8px 0;
  }
  #circleWrap {
    position: relative;
    width: 280px; height: 280px;
    margin: 10px auto;
  }
  .playerTag {
    position: absolute;
    background: rgba(255,255,255,0.15);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 13px;
    white-space: nowrap;
    transform: translate(-50%, -50%);
  }
  .playerTag.active {
    background: #ffd54f;
    color: #1f1c2c;
    font-weight: bold;
  }
  #bottle {
    position: absolute;
    top: 50%; left: 50%;
    font-size: 70px;
    transform: translate(-50%, -50%) rotate(0deg);
    transform-origin: center center;
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  }
  #banner { min-height: 28px; font-size: 17px; margin: 6px 0; font-weight: bold; }
  #chat {
    background: rgba(0,0,0,0.35); border-radius: 12px; height: 180px;
    overflow-y: auto; padding: 10px; text-align: left; font-size: 15px;
  }
  .msg { margin: 4px 0; word-wrap: break-word; }
  .msg b { color: #ffd54f; }
  #chatrow { display: flex; gap: 6px; margin-top: 8px; }
  #chatrow input { margin: 0; flex: 1; }
  #chatrow button { margin: 0; padding: 10px 16px; font-size: 16px; }
</style>
</head>
<body>

<div id="join" class="screen">
  <h1>Truth Chat Bottle Game</h1>
  <p>No login needed. Just pick a name and play!</p>
  <input id="name" placeholder="Your nickname (any name)" maxlength="15">
  <input id="room" placeholder="Room code (share with friends)" maxlength="15" value="public">
  <button onclick="joinGame()">Join Game</button>
</div>

<div id="game" class="screen" style="display:none;">
  <h1>Truth Chat Bottle</h1>
  <div id="roomLabel" style="font-size:13px;opacity:0.85;"></div>
  <div id="circleWrap">
    <div id="bottle">🍾</div>
  </div>
  <button onclick="spin()">Spin the Bottle</button>
  <div id="banner"></div>
  <div id="chat"></div>
  <div id="chatrow">
    <input id="msg" placeholder="Type a message..." maxlength="200">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, push, onValue, onDisconnect, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDoEN6MRNgZ8xKt9zxSfcHRwF77CItz7hs",
  authDomain: "turth-chat-bottle.firebaseapp.com",
  databaseURL: "https://turth-chat-bottle-default-rtdb.firebaseio.com",
  projectId: "turth-chat-bottle",
  storageBucket: "turth-chat-bottle.firebasestorage.app",
  messagingSenderId: "953030342199",
  appId: "1:953030342199:web:d7e073979f343e55f731b2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const myId = "p" + Math.random().toString(36).slice(2, 9);
let myName = "", room = "", players = {}, rotation = 0, lastSpinTs = null;
const RADIUS = 115;

window.joinGame = function () {
  myName = document.getElementById("name").value.trim() || ("Guest" + Math.floor(Math.random() * 9000 + 1000));
  room = document.getElementById("room").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "") || "public";

  const meRef = ref(db, "rooms/" + room + "/players/" + myId);
  set(meRef, { name: myName });
  onDisconnect(meRef).remove();

  document.getElementById("join").style.display = "none";
  document.getElementById("game").style.display = "block";
  document.getElementById("roomLabel").textContent = "Room: " + room;

  onValue(ref(db, "rooms/" + room + "/players"), function (snap) {
    players = snap.val() || {};
    renderCircle();
  });

  onValue(ref(db, "rooms/" + room + "/spin"), function (snap) {
    const s = snap.val();
    if (lastSpinTs === null) { lastSpinTs = s ? s.ts : 0; return; }
    if (!s || s.ts === lastSpinTs) return;
    lastSpinTs = s.ts;
    rotation += 5 * 360 + s.angle;
    document.getElementById("bottle").style.transform = "translate(-50%, -50%) rotate(" + rotation + "deg)";
    document.getElementById("banner").textContent = "";
    clearActive();
    setTimeout(function () {
      document.getElementById("banner").textContent = "🎤 " + s.fromName + " spun -> " + s.toName + "! Your turn!";
      markActive(s.toId);
    }, 4100);
  });

  onValue(query(ref(db, "rooms/" + room + "/chat"), limitToLast(50)), function (snap) {
    const box = document.getElementById("chat");
    box.innerHTML = "";
    snap.forEach(function (child) {
      const m = child.val();
      const div = document.createElement("div");
      div.className = "msg";
      const b = document.createElement("b");
      b.textContent = m.name + ": ";
      const t = document.createElement("span");
      t.textContent = m.text;
      div.appendChild(b);
      div.appendChild(t);
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  });
};

function clearActive() {
  document.querySelectorAll(".playerTag").forEach(function (el) { el.classList.remove("active"); });
}

function markActive(pid) {
  const el = document.getElementById("tag-" + pid);
  if (el) el.classList.add("active");
}

function renderCircle() {
  const wrap = document.getElementById("circleWrap");
  const old = wrap.querySelectorAll(".playerTag");
  old.forEach(function (el) { el.remove(); });

  const ids = Object.keys(players);
  const n = ids.length;
  const center = 140;

  ids.forEach(function (id, i) {
    const angleDeg = (360 / n) * i - 90;
    const angleRad = angleDeg * Math.PI / 180;
    const x = center + RADIUS * Math.cos(angleRad);
    const y = center + RADIUS * Math.sin(angleRad);

    const tag = document.createElement("div");
    tag.className = "playerTag";
    tag.id = "tag-" + id;
    tag.style.left = x + "px";
    tag.style.top = y + "px";
    let label = players[id].name;
    if (id === myId) label += " (you)";
    tag.textContent = label;
    wrap.appendChild(tag);
  });
}

window.spin = function () {
  const ids = Object.keys(players);
  const n = ids.length;
  const others = ids.filter(function (i) { return i !== myId; });
  if (others.length < 1) {
    alert("You need at least 1 more player in this room. Share your room code with a friend!");
    return;
  }
  const myIndex = ids.indexOf(myId);
  const targetIndex = Math.floor(Math.random() * others.length);
  const targetId = others[targetIndex];
  const targetListIndex = ids.indexOf(targetId);

  const anglePerSlot = 360 / n;
  const targetAngle = anglePerSlot * targetListIndex - anglePerSlot * myIndex;
  const normalized = ((targetAngle % 360) + 360) % 360;

  set(ref(db, "rooms/" + room + "/spin"), {
    fromName: myName,
    toName: players[targetId].name,
    toId: targetId,
    angle: normalized,
    ts: Date.now()
  });
};

window.sendMsg = function () {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;
  push(ref(db, "rooms/" + room + "/chat"), { name: myName, text: text, ts: Date.now() });
  input.value = "";
};
</script>

</body>
</html>
